<!DOCTYPE html>
<html>
<head>
    <title>Receipt Generator</title>

    <link rel="stylesheet" href="https://pyscript.net/releases/2025.8.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2025.8.1/core.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body {
    font-family: Arial, sans-serif;
    margin: 0;
    color: #222;

    background-image: url("https://static.wikia.nocookie.net/jujutsu-shenanigans/images/d/dd/Towers.png/revision/latest/scale-to-width-down/1200?cb=20250602212122");
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
}
        header {
            background-color: #d10ffd;
            color: white;
            padding: 20px;
            text-align: center;
        }
        
        header h1 {
            font-family: "Press Start 2P", monospace;
            font-size: 28px;
        }

        .card h2 {
            font-family: "Press Start 2P", monospace;
            font-size: 20px;
        }

        nav {
            background-color: #e364ff;
            text-align: center;
            padding: 12px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            font-weight: bold;
        }

        nav a:hover {
            color: #771a81;
        }

        .container {
            max-width: 900px;
            margin: 30px auto;
            padding: 20px;
        }

        .card {
            background-color: rgba(255, 255, 255, 0.75);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
            margin-bottom: 25px;
        }
        
        header p {
            font-family: "Press Start 2P", monospace;
            font-size: 10px;
        }
        
        h1, h2 {
            text-align: center;
        }

        .menu-item {
    display: flex;
    align-items: center;
    gap: 15px;
    padding: 12px;
    margin: 10px 0;
    border: 1px solid #ddd;
    border-radius: 8px;
    background-color: #fafafa;

    transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.menu-item:hover {
    transform: translateY(-5px);
    box-shadow: 0 6px 15px rgba(0, 0, 0, 0.15);
}

        .menu-icon {
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .menu-icon img {
            width: 55px;
            height: 55px;
            object-fit: contain;
        }

        .menu-info {
            flex: 1;
        }

        .menu-info strong {
            display: block;
            font-size: 17px;
        }

        .menu-info span {
            color: #555;
        }

        input[type="checkbox"] {
            width: 20px;
            height: 20px;
        }

        button {
            display: block;
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            background-color: #e139ea;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }

        button:hover {
            background-color: #eb7cf0;
        }

        #show {
            margin-top: 25px;
            padding: 20px;
            background-color: #f8f8f8;
            border-radius: 8px;
            border: 1px solid #ddd;
        }
    </style>
</head>

<body>

    <header>
        <h1>UNLICENSED STUDIOS</h1>
        <p>Items to Jujutsu, Shenanigan, and more...!</p>
    </header>

    <nav>
        <a href="index.html">SKU Generator</a>
        <a href="receipt.html">Receipt Generator</a>
    </nav>

    <div class="container">

        <div class="card">
<br>
            <h2>OUR ITEMS...</h2>

            <div class="menu-item">
                <div class="menu-icon">
                    <img src="https://static.wikia.nocookie.net/jujutsu-shenanigans/images/e/ec/TransfiguredFleshStillPreview.png/revision/latest?cb=20260908163404" alt="TransfiguredHuman">
                </div>

                <div class="menu-info">
                    <strong>Transfigured Human</strong>
                    <span>₱100.00</span>
                </div>

                <input type="checkbox" id="item1" value="100">
            </div>

            <div class="menu-item">
                <div class="menu-icon">
                    <img src="https://static.wikia.nocookie.net/jujutsu-shenanigans/images/2/27/SodaStillPreview.png/revision/latest?cb=20260908163318" alt="Soda">
                </div>

                <div class="menu-info">
                    <strong>Delectable Soda</strong>
                    <span>₱5.00</span>
                </div>

                <input type="checkbox" id="item2" value="5">
            </div>


            <div class="menu-item">
                <div class="menu-icon">
                    <img src="https://static.wikia.nocookie.net/jujutsu-shenanigans/images/6/68/HazenikosEyeStillPreview.png/revision/latest?cb=20260908163344" alt="Hazenoki">
                </div>

                <div class="menu-info">
                    <strong>Hazenoki's Eye</strong>
                    <span>₱60.00</span>
                </div>

                <input type="checkbox" id="item3" value="60">
            </div>

            <div class="menu-item">
                <div class="menu-icon">
                    <img src="https://static.wikia.nocookie.net/jujutsu-shenanigans/images/d/dc/BowlingBallStillPreview.png/revision/latest?cb=20260908163430" alt="Bowling">
                </div>

                <div class="menu-info">
                    <strong>Bowling Ball</strong>
                    <span>₱70.00</span>
                </div>

                <input type="checkbox" id="item4" value="70">
            </div>


            <div class="menu-item">
                <div class="menu-icon">
                    <img src="https://static.wikia.nocookie.net/jujutsu-shenanigans/images/9/9e/CrowbarStillPreview.png/revision/latest?cb=20260908163433" alt="Crowbar">
                </div>

                <div class="menu-info">
                    <strong>Menacing Crowbar</strong>
                    <span>₱100.00</span>
                </div>

                <input type="checkbox" id="item5" value="100">
            </div>


            <div class="menu-item">
                <div class="menu-icon">
                    <img src="https://static.wikia.nocookie.net/jujutsu-shenanigans/images/8/8f/TintedGlassesStillPreview.png/revision/latest?cb=20260908163408" alt="Glasses">
                </div>

                <div class="menu-info">
                    <strong>Tinted Glasses</strong>
                    <span>₱90.00</span>
                </div>

                <input type="checkbox" id="item6" value="90">
            </div>


            <div class="menu-item">
                <div class="menu-icon">
                    <img src="https://static.wikia.nocookie.net/jujutsu-shenanigans/images/6/69/NaginataStillPreview.png/revision/latest?cb=20260908163418" alt="Naginata">
                </div>

                <div class="menu-info">
                    <strong>Naginata</strong>
                    <span>₱80.00</span>
                </div>

                <input type="checkbox" id="item7" value="80">
            </div>


            <div class="menu-item">
                <div class="menu-icon">
                    <img src="https://static.wikia.nocookie.net/jujutsu-shenanigans/images/a/ad/BroomStillPreview.png/revision/latest?cb=20260908163437" alt="Broom">
                </div>

                <div class="menu-info">
                    <strong>Magical Broom</strong>
                    <span>₱150.00</span>
                </div>

                <input type="checkbox" id="item8" value="150">
            </div>


            <button py-click="create_order">
                Generate Receipt
            </button>

            <div id="show"></div>

        </div>

    </div>

    <py-script src="main.py"></py-script>

</body>
</html>
